[package]
name = "bsky_tui"
version = "0.0.11"
edition = "2018"
authors = ["Keisuke Toyota <hm.pudding0715@gmail.com>"]
repository = "https://github.com/ksk001100/bsky_tui"
keywords = ["bluesky", "bsky", "tui"]
license-file = "LICENSE"
readme = "README.md"
description = "Bluesky TUI Client"

[dependencies]
crossterm = "0.29"
eyre = "0.6"
seahorse = "2.2"
tokio = { version = "1", features = ["full"] }
ratatui = { version = "0.30", features = ["all-widgets"] }
ratatui-image = { version = "=11.0.6", default-features = false, features = ["crossterm"] }
atrium-api = "0.25.8"
atrium-xrpc = "0.12"
atrium-xrpc-client = "0.5"
bsky-sdk = "0.1.24"
config = "0.15"
chrono = "0.4"
webbrowser = "1"
tui-input = "0.15"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
unicode-width = "0.2"
unicode-segmentation = "1.13"
zeroize = "1.9"
keyring = "4.1"
rpassword = "7.5"
